name: Validate and release CIAD plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install schema validator
        run: npm install --no-save --ignore-scripts ajv@8.20.0
      - name: Validate manifests and build the release bytes
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/schema_check.mjs .
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            python3 scripts/package_plugin.py --root . --output work/CIAD-plugin.zip --tag "$RELEASE_TAG"
          else
            python3 scripts/package_plugin.py --root . --output work/CIAD-plugin.zip
          fi
      - name: Check hosted connection contract
        run: node scripts/check_public.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checked-plugin
          path: |
            work/CIAD-plugin.zip
            work/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: checked-plugin
          path: checked
      - name: Publish the checked artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: checked
        run: |
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" CIAD-plugin.zip SHA256SUMS.txt --verify-tag --title "CIAD $RELEASE_TAG" --notes "CIAD plugin for OpenAI and Anthropic. Directory publication requires provider review."
